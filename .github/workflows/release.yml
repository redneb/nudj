name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - run: npm run build

      - run: npm run build:cli:bundle

      # Publish to npm (OIDC via trusted publisher, no secret needed)
      - run: npm publish

      # Create GitHub Release with bundled CLI
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/nudj.js
          generate_release_notes: true
